<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#f5f8ff"/>
  <!-- step bars: degree saturation -->
  <rect x="120" y="600" width="150" height="180" rx="10" fill="#c7d6fb"/>
  <rect x="310" y="520" width="150" height="260" rx="10" fill="#a9c2f9"/>
  <rect x="500" y="440" width="150" height="340" rx="10" fill="#7ea3f6"/>
