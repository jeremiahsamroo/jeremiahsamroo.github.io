    <circle cx="300" cy="300" r="16"/><circle cx="350" cy="360" r="12"/><circle cx="270" cy="380" r="12"/>
    <circle cx="320" cy="260" r="10"/><circle cx="390" cy="310" r="14"/><circle cx="250" cy="320" r="9"/>
  </g>
  <g fill="#e07b39">
    <circle cx="700" cy="480" r="16"/><circle cx="760" cy="540" r="12"/><circle cx="670" cy="560" r="12"/>
    <circle cx="720" cy="440" r="10"/><circle cx="790" cy="490" r="14"/><circle cx="650" cy="500" r="9"/>
  </g>
  <g fill="#8a94a6">
