<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#f5f8ff"/>
  <!-- parse tree: S -> NP VP -->
  <g font-family="system-ui, sans-serif" font-size="30" fill="#ffffff" text-anchor="middle">
    <rect x="520" y="180" width="160" height="70" rx="12" fill="#1d4ed8"/>
    <text x="600" y="228">S</text>
    <rect x="240" y="380" width="160" height="70" rx="12" fill="#4f7ef2"/>
    <text x="320" y="428">NP</text>
    <rect x="800" y="380" width="160" height="70" rx="12" fill="#4f7ef2"/>
    <text x="880" y="428">VP</text>
    <rect x="120" y="580" width="160" height="70" rx="12" fill="#7ea3f6"/>
    <text x="200" y="628">Det</text>
    <rect x="360" y="580" width="160" height="70" rx="12" fill="#7ea3f6"/>
    <text x="440" y="628">N</text>
    <rect x="680" y="580" width="160" height="70" rx="12" fill="#7ea3f6"/>
    <text x="760" y="628">V</text>
    <rect x="920" y="580" width="160" height="70" rx="12" fill="#7ea3f6"/>
    <text x="1000" y="628">NP</text>
  </g>
  <g stroke="#33415c" stroke-width="5" stroke-linecap="round">
    <line x1="600" y1="250" x2="320" y2="380"/>
    <line x1="600" y1="250" x2="880" y2="380"/>
    <line x1="320" y1="450" x2="200" y2="580"/>
    <line x1="320" y1="450" x2="440" y2="580"/>
    <line x1="880" y1="450" x2="760" y2="580"/>
    <line x1="880" y1="450" x2="1000" y2="580"/>
  </g>
  <text x="90" y="140" font-family="system-ui, sans-serif" font-size="34" fill="#33415c">S &#8594; NP VP</text>
  <text x="120" y="842" font-family="system-ui, sans-serif" font-size="28" fill="#8a94a6">CYK chart parser &#183; backpointers &amp; unary closure</text>
</svg>
